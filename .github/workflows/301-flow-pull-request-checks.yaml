# SPDX-License-Identifier: Apache-2.0
name: '301: [FLOW] PR Checks'
on:
  pull_request:
    branches:
      - 'main'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  execute-tests:
    # Run all tests ensure 100% threshold is maintained
    name: Execute Tests
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Runner
        uses: pandaswhocode/initialize-github-job@74303607c68fe88ff9b7bfc05c40ca948fa04b13 # v1.5.0
        with:
          checkout: 'true'
          checkout-ref: '${{ github.ref }}'
          checkout-token: '${{ secrets.GITHUB_TOKEN }}'
          checkout-fetch-depth: '0'
          setup-node: 'true'
          node-version: '24'
          node-registry: 'https://registry.npmjs.org/'

      - name: Build & Test Package
        run: |
          echo "::group::Install Dependencies"
          npm ci
          echo "::endgroup::"

          echo "::group::Build Package"
          npm run build
          echo "::endgroup::"

          echo "::group::Test Package"
          npm run test
          echo "::endgroup::"
